[project]
name = "hetzner-watch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

# The local availability watcher's mail (src/hetzner_watch/availability.py).
# An extra, not a dependency: mailstile is a private sibling checkout, absent
# from CI, which syncs --frozen without it.
[project.optional-dependencies]
mail = ["mailstile"]

[tool.uv.sources]
mailstile = { path = "../mailstile", editable = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hetzner_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
