name: hetzner-watch

on:
  schedule:
    # Hourly, off the top of the hour: GitHub delays and drops schedules most
    # at :00.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# A manual workflow_dispatch overlapping the hourly cron would race on
# snapshot.json and the git push (Finding 9); serialize instead of cancelling
# a run that may already be mid-way through an Issues API mutation.
concurrency:
  group: hetzner-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - run: uv sync

      - run: uv run pytest -q

      - name: Avvisa se il tipo osservato torna disponibile
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: uv run python -m hetzner_watch.availability

      - name: Confronta il catalogo
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python -m hetzner_watch

      - name: Committa lo snapshot se cambiato
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain snapshot.json)" ]]; then
            git config user.name "hetzner-watch"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add snapshot.json
            git commit -m "chore: snapshot $(date -u +%F)"
            # concurrency.group above serializes runs of this workflow, but
            # not a push landing on the same branch from elsewhere meanwhile:
            # rebase-and-retry instead of a bare push.
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              if git rebase "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              git rebase --abort || true
              if [[ "$attempt" == 3 ]]; then
                echo "push fallito dopo 3 tentativi" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

      # A public repository's schedule is disabled after 60 days without
      # activity, and a run is not activity: it happened on 2026-10-07. A
      # commit is; the API's "enable" is not documented to reset the clock.
      # Snapshot commits are rare, so push an empty one only when main has
      # been quiet for 50 days.
      - name: Keepalive
        if: always()
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          last=$(git log -1 --format=%ct "origin/$GITHUB_REF_NAME")
          if (( $(date +%s) - last > 50 * 86400 )); then
            git config user.name "hetzner-watch"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
