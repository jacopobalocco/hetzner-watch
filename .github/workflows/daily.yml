name: hetzner-watch

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# A manual workflow_dispatch overlapping the 07:00 cron would race on
# snapshot.json and the git push (Finding 9); serialize instead of cancelling
# a run that may already be mid-way through an Issues API mutation.
concurrency:
  group: hetzner-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - run: uv run --frozen pytest -q

      - name: Confronta il catalogo
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run --frozen python -m hetzner_watch

      - name: Committa lo snapshot se cambiato
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain snapshot.json)" ]]; then
            git config user.name "hetzner-watch"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add snapshot.json
            git commit -m "chore: snapshot $(date -u +%F)"
            # concurrency.group above serializes runs of this workflow, but
            # not a push landing on the same branch from elsewhere meanwhile:
            # rebase-and-retry instead of a bare push.
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              if git rebase "origin/$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              git rebase --abort || true
              if [[ "$attempt" == 3 ]]; then
                echo "push fallito dopo 3 tentativi" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
